name: Ubuntu VM validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Optional branch or ref to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ubuntu-vm-validation-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Ubuntu 22.04 amd64 Compose smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python matching the API image
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Set up Node for dashboard checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and build dashboard
        working-directory: frontend
        run: npm run lint && npm run build

      - name: Check shell and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find deploy -type f -name '*.sh' -print0)
          python3 -m compileall -q backend telemetry scripts tools
          python3 -m py_compile deploy/nivusctl
          python3 -m py_compile deploy/nivus-timesyncd.py
          python3 deploy/nivusctl help | grep -q 'sudo nivus maintenance disable'
          python3 -m unittest discover -s tools/ai_executor -p 'test_*.py'
          python3 -m unittest discover -s telemetry -p 'test_*.py'
          python3 -m unittest discover -s backend -p 'test_*.py'
          node frontend/tests/telemetry.test.mjs

      - name: Prepare isolated Compose smoke environment
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p data mosquitto secrets runtime-state runtime-time-sync
          cat > .env <<EOF
          NIVUS_BIND_ADDRESS=127.0.0.1
          NIVUS_NODE_NAME=compose-config-check
          NIVUS_HTTPS_PORT=28443
          NIVUS_DATA_DIR=$GITHUB_WORKSPACE/data
          NIVUS_MOSQUITTO_DATA_DIR=$GITHUB_WORKSPACE/mosquitto
          NIVUS_SECRET_DIR=$GITHUB_WORKSPACE/secrets
          NIVUS_MAINTENANCE_STATE_DIR=$GITHUB_WORKSPACE/runtime-state
          NIVUS_TIME_SYNC_DIR=$GITHUB_WORKSPACE/runtime-time-sync
          NIVUS_RUNTIME_UID=12001
          NIVUS_RUNTIME_GID=12001
          NIVUS_API_MEMORY_LIMIT=256m
          NIVUS_WORKER_MEMORY_LIMIT=128m
          NIVUS_MQTT_MEMORY_LIMIT=64m
          NIVUS_WEB_MEMORY_LIMIT=64m
          NIVUS_API_CPUS=1.00
          NIVUS_WORKER_CPUS=0.50
          NIVUS_MQTT_CPUS=0.25
          NIVUS_WEB_CPUS=0.25
          EOF
          chmod 600 .env
          touch secrets/jwt_secret secrets/mqtt_api_password secrets/mqtt_worker_password \
            secrets/mqtt_agent_password secrets/mqtt_health_password secrets/mosquitto_passwords \
            secrets/mosquitto_acl secrets/tls.crt secrets/tls.key
          docker info >/dev/null
          docker compose config --quiet

      - name: Build candidate images
        run: docker compose build --pull api worker web

      - name: Run isolated MQTT to SQLite smoke test
        shell: bash
        env:
          NIVUS_ALLOW_STAGING_SMOKE: "1"
          NIVUS_STAGING_REQUIRE_LEGACY_HOST: "0"
        run: bash deploy/verify-compose-staging.sh

  restore-rollback-sandbox:
    name: Ubuntu 22.04 isolated restore rollback
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Build disposable recovery sandbox
        run: docker build --pull --file deploy/ci/restore-rollback.Dockerfile --tag nivus-restore-rollback-ci .

      - name: Exercise failed restore and automatic rollback in an isolated container
        run: >-
          docker run --rm --network none
          --security-opt=no-new-privileges
          --cap-drop=ALL
          --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER
          nivus-restore-rollback-ci
