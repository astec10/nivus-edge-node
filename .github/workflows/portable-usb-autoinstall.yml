name: Portable USB autoinstall seed

on:
  push:
    branches: [main]
    paths:
      - "deploy/portable_usb/**"
      - "tests/test_portable_usb_*.py"
      - ".github/workflows/portable-usb-autoinstall.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/portable_usb/**"
      - "tests/test_portable_usb_*.py"
      - ".github/workflows/portable-usb-autoinstall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-usb-autoinstall-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-validation:
    name: Reviewable seed, serial revalidation, and synthetic disk tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile USB preparation tools
        run: python -m py_compile deploy/portable_usb/select_target.py deploy/portable_usb/generate_autoinstall.py

      - name: Run synthetic USB tests
        run: python -m unittest discover -s tests -p 'test_portable_usb_*.py' -v
