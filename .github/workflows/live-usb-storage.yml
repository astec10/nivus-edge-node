name: Live USB storage

on:
  push:
    branches: [main]
    paths:
      - "deploy/live-usb/**"
      - "tests/live_usb_storage.sh"
      - ".github/workflows/live-usb-storage.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/live-usb/**"
      - "tests/live_usb_storage.sh"
      - ".github/workflows/live-usb-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-usb-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistent-volume:
    name: Persistent ext4 volume and fail-closed boot guard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install filesystem utilities
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs fdisk util-linux

      - name: Check shell syntax
        run: |
          set -Eeuo pipefail
          bash -n deploy/live-usb/prepare-data-volume.sh
          bash -n deploy/live-usb/install-image-integration.sh
          bash -n deploy/live-usb/nivus-data-volume-guard

      - name: Exercise loop-backed ext4 partition on the hosted runner
        run: sudo bash tests/live_usb_storage.sh
