name: Dashboard and hardware telemetry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/thermal-sensor-sources-20261114]

permissions:
  contents: read

jobs:
  frontend-and-sensors:
    name: Frontend and sensor checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend and telemetry dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt -r telemetry/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and build dashboard
        working-directory: frontend
        run: npm run lint && npm run build

      - name: Check chart helpers
        run: node frontend/tests/telemetry.test.mjs

      - name: Check sensor and persistence behavior
        run: |
          python -m compileall -q backend telemetry
          python -m unittest discover -s telemetry -p 'test_*.py' -v
          python -m unittest discover -s backend -p 'test_*.py' -v
