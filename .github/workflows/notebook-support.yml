name: Notebook support
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nivus-notebook-support
  cancel-in-progress: false
jobs:
  trusted-main-checks:
    if: >-
      github.repository == 'astec10/nivus-edge-node' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == 'astec10'
    runs-on: [self-hosted, linux, x64, nivus-support]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check Python and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find deploy -type f -name '*.sh' -print0)
          python -m compileall -q backend telemetry scripts tools
      - name: Run focused unit and telemetry checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tools/ai_executor -p 'test_*.py'
          python -m unittest discover -s telemetry -p 'test_*.py'
          python -m unittest discover -s backend -p 'test_*.py'
          node frontend/tests/telemetry.test.mjs
      - name: Lint and build the frontend
        working-directory: frontend
        run: npm run lint && npm run build
      - name: Report tested revision
        run: git rev-parse HEAD
