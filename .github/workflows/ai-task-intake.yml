name: AI task intake

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open GitHub issue number created from the AI development task form
        required: true
        type: string
      reviewed_public_content:
        description: Confirm the issue contains public or synthetic information only
        required: true
        type: boolean
      authorize_free_model_call:
        description: Authorize one Gemini free-tier proposal after reviewing the issue
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-task-intake-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  validate-and-queue:
    if: >-
      inputs.reviewed_public_content == true &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate issue contract
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          AUTHORIZE_FREE_MODEL_CALL: ${{ inputs.authorize_free_model_call }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq 'if has("pull_request") then error("a pull request cannot be queued as an issue task") elif .state != "open" then error("task issue must be open") else .body end' > "$RUNNER_TEMP/issue-body.md"
          validator_args=()
          if [[ "$AUTHORIZE_FREE_MODEL_CALL" == "true" ]]; then
            validator_args+=(--require-free-tier)
          fi
          python scripts/validate_ai_task.py --file "$RUNNER_TEMP/issue-body.md" "${validator_args[@]}"

      - name: Ensure queue label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api --method POST "repos/$REPOSITORY/labels" -f name='ai:queued' -f color='5319e7' -f description='Validated task waiting for an external AI worker' >/dev/null 2>&1; then
            gh api "repos/$REPOSITORY/labels/ai%3Aqueued" >/dev/null
          fi

      - name: Mark issue as queued for an executor
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORIZE_FREE_MODEL_CALL: ${{ inputs.authorize_free_model_call }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/labels" -f 'labels[]=ai:queued' >/dev/null
          if [[ "$AUTHORIZE_FREE_MODEL_CALL" != "true" ]]; then
            # A fresh intake-only review must revoke a stale per-issue call authorization.
            gh api --method DELETE "repos/$REPOSITORY/issues/$ISSUE_NUMBER/labels/ai%3Aready" >/dev/null 2>&1 || true
            echo "Issue queued for intake only; no model call authorized."
            exit 0
          fi

          if ! gh api --method POST "repos/$REPOSITORY/labels" -f name='ai:ready' -f color='0e8a16' -f description='Explicitly authorized free-tier AI proposal' >/dev/null 2>&1; then
            gh api "repos/$REPOSITORY/labels/ai%3Aready" >/dev/null
          fi
          # Re-adding this label is the single dispatch path to the worker.
          # The label event itself starts one run; do not also call workflow_dispatch.
          gh api --method DELETE "repos/$REPOSITORY/issues/$ISSUE_NUMBER/labels/ai%3Aready" >/dev/null 2>&1 || true
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/labels" -f 'labels[]=ai:ready' >/dev/null
