server_tokens off;
client_max_body_size 1m;

# This Nginx service is the public edge for the Compose stack. Use the direct
# peer address, not a caller-supplied X-Forwarded-For header.
limit_req_zone $binary_remote_addr zone=nivus_login_per_ip:10m rate=10r/m;
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_session_timeout 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /token {
        limit_req zone=nivus_login_per_ip burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
